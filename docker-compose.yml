version: '3.8'
services:
  backend:
    build: ./backend
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    environment:
      - DATABASE_URL=postgresql://postgres:secret@db:5432/aiproctor
    depends_on:
      - db

  student:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/student:/app
    ports:
      - "3000:3000"
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000

  teacher:
    image: node:20-alpine
    working_dir: /app
    volumes:
      - ./apps/teacher:/app
    ports:
      - "3001:3001"
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_WS_URL=ws://localhost:8000

  db:
    image: postgres:15-alpine
    environment:
      POSTGRES_DB: aiproctor
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: secret
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
